MODEL:
  PRETRAIN_CHOICE: 'imagenet'#imagenet
  PRETRAIN_PATH: 'weights/resnet50-19c8e357.pth'  # 预训练权重路径weights/jx_vit_base_p16_224-80ecf9dd.pth 断点续训不需要预训练
  METRIC_LOSS_TYPE: 'triplet'
  IF_LABELSMOOTH: 'off'
  IF_WITH_CENTER: 'no'
  NAME: 'resnet50'
  NO_MARGIN: True
  DEVICE_ID: ('5')
  TRANSFORMER_TYPE: ''
  STRIDE_SIZE: [12, 12]
  SIE_CAMERA: False
  SIE_COE: 3.0
  JPM: False
  RE_ARRANGE: False
  #IF_CONTINUE: TRUE
  CONTINUE_PATH: ''

INPUT:
  SIZE_TRAIN: [256, 128]
  SIZE_TEST: [256, 128]
  PROB: 0.5 # random horizontal flip
  RE_PROB: 0.5 # random erasing
  PADDING: 10
  PIXEL_MEAN: [0.5, 0.5, 0.5]
  PIXEL_STD: [0.5, 0.5, 0.5]

DATASETS:
  NAMES: ('ballshow')
  ROOT_DIR: ('./data')

DATALOADER:
  SAMPLER: 'softmax_triplet'
  NUM_INSTANCE: 4
  NUM_WORKERS: 2   #8

SOLVER:
  OPTIMIZER_NAME: 'AdamW'#SGD
  MAX_EPOCHS: 240
  BASE_LR: 0.0002 #0.008
  IMS_PER_BATCH: 64
  WARMUP_METHOD: 'linear'
  LARGE_FC_LR: False
  CHECKPOINT_PERIOD: 2   #120 每两次保存一次
  LOG_PERIOD: 50
  EVAL_PERIOD: 2      #120  每次保存都测试一遍精度
  WEIGHT_DECAY:  1e-4
  WEIGHT_DECAY_BIAS: 1e-4
  BIAS_LR_FACTOR: 2

TEST:
  EVAL: True
  IMS_PER_BATCH: 256
  RE_RANKING: TRUE
  WEIGHT: ''
  NECK_FEAT: 'before'
  FEAT_NORM: 'yes'

OUTPUT_DIR: 'logs/BallShow_resnet'


